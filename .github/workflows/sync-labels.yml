name: 저장소 라벨 동기화

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/LABELS.md
      - .github/scripts/setup-labels.sh
      - .github/workflows/sync-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FinShield 라벨 적용
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/setup-labels.sh "$GH_REPO"
