name: Law Evidence

on:
  workflow_dispatch:
    inputs:
      blocker_id:
        description: Blocker proof policy to execute
        required: true
        type: choice
        options:
          - B-LAW-01
      mode:
        description: gate 는 증거를 만들고 development 는 관측만 찍는다
        required: true
        default: development
        type: choice
        options:
          - development
          - gate

permissions:
  contents: read
  actions: read

concurrency:
  group: law-evidence-${{ inputs.blocker_id }}-${{ inputs.mode }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: law-evidence / ${{ inputs.blocker_id }}
    if: github.ref == 'refs/heads/main'
    environment: provider-spike
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install trusted validator dependencies
        run: npm --prefix trusted ci --ignore-scripts

      - name: Validate trusted main commit
        env:
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" || ! "${WORKFLOW_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::evidence must run from an immutable main commit"
            exit 1
          fi
          test "$(git -C trusted rev-parse HEAD)" = "${WORKFLOW_HEAD_SHA}"

      - name: Run blocker evidence harness
        env:
          BLOCKER_ID: ${{ inputs.blocker_id }}
          CODE_UNDER_TEST_SHA: ${{ github.sha }}
          EVIDENCE_REGION: github-hosted
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_REPOSITORY: ${{ github.workspace }}/trusted
          EVIDENCE_MODE: ${{ inputs.mode }}
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
          VERCEL_PROJECT: finshield
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: node trusted/.github/scripts/run-law-evidence.mjs --run

      - name: Validate raw evidence
        if: inputs.mode == 'gate'
        env:
          BLOCKER_ID: ${{ inputs.blocker_id }}
          CODE_UNDER_TEST_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_REPOSITORY: ${{ github.workspace }}/trusted
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: node trusted/.github/scripts/run-law-evidence.mjs --validate

      - name: Upload evidence artifact
        if: inputs.mode == 'gate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-evidence-${{ inputs.blocker_id }}-${{ github.sha }}
          path: evidence-output/result.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
