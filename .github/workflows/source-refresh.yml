name: 공식 근거 신선도 갱신

# 공식 근거는 마지막 수집 뒤 24시간이 지나면 STALE 이 되고 확정 판정에 쓰이지 않는다.
# 3시간마다 공공데이터·진흥원 공식 자료를 다시 수집해 운영 KB 에 적재하고,
# 원문이 같은 공개 Demo 고정 근거에 재수집 기록을 잇는다. 이 저장소의 예약 실행은
# 몇 시간씩 늦게 시작되기도 해서 간격을 좁혀 여유를 둔다. Gate 증거 수집이 아니므로
# 결과를 증거 artifact 로 올리지 않는다.

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: source-refresh
    if: github.ref == 'refs/heads/main'
    environment: provider-spike
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm --prefix trusted ci --ignore-scripts

      - name: 공식 자료 수집
        env:
          BLOCKER_ID: B-SOURCE-03
          CODE_UNDER_TEST_SHA: ${{ github.sha }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EVIDENCE_REGION: github-hosted
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_REPOSITORY: ${{ github.workspace }}/trusted
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        # 공공데이터포털 접속이 해외 실행 환경에서 가끔 시간 초과로 끊긴다. harness 는
        # Source 증거 scope 라 고치지 않고, 실패하면 1분 뒤 두 번까지 다시 수집한다.
        # --run 은 시작할 때 이전 결과 파일을 지우므로 다시 실행해도 섞이지 않는다.
        run: |
          for attempt in 1 2 3; do
            if node trusted/.github/scripts/run-source-evidence.mjs --run; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "수집 실패, 60초 뒤 다시 시도 ($attempt/3)"; sleep 60; fi
          done
          exit 1

      - name: 수집 결과 정책 검사
        env:
          BLOCKER_ID: B-SOURCE-03
          CODE_UNDER_TEST_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_REPOSITORY: ${{ github.workspace }}/trusted
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: node trusted/.github/scripts/run-source-evidence.mjs --validate

      - name: 운영 KB 적재
        env:
          DATABASE_URL: ${{ secrets.FINSHIELD_DATABASE_URL }}
        run: node trusted/scripts/kb/load-source-snapshots.mjs --result evidence-output/result.json --apply

      - name: Demo 고정 근거 재수집 연결
        env:
          DATABASE_URL: ${{ secrets.FINSHIELD_DATABASE_URL }}
        run: node trusted/scripts/kb/refresh-demo-seed-sources.mjs --result evidence-output/result.json

  # 고위험 행동 경고가 쓰는 진흥원 예방 공지(24020)의 본문과 검토 기한을 본다.
  # 기한 72시간 전이나 본문이 바뀌면 실패해 다시 검토할 시간을 둔다. 비밀을 쓰지 않는다.
  warning-review:
    name: warning-review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: 검토한 예방 공지 점검
        run: node scripts/kb/check-warning-review.mjs
