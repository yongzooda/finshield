name: Health Evidence

on:
  workflow_dispatch:
    inputs:
      blocker_id:
        description: Blocker proof policy to execute
        required: true
        type: choice
        options:
          - B-HEALTH-01

permissions:
  contents: read
  actions: read

concurrency:
  group: health-evidence-${{ inputs.blocker_id }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: health-evidence / ${{ inputs.blocker_id }}
    if: github.ref == 'refs/heads/main'
    environment: provider-spike
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 기존 PreCase Runtime 호환용 이름. 코드·테스트 이관 PR 전까지 유지한다.
      PRECASE_CI: "1"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      ANTHROPIC_API_KEY: sk-ci-placeholder-not-a-real-key
      ANTHROPIC_MODEL: claude-opus-5
      PUBLIC_MCP_ENABLED: "false"
      LAW_API_OC: ci-placeholder
      LAW_API_BASE: https://www.law.go.kr/DRF
      MAX_TOOL_CALLS_PER_CYCLE: "12"
      MAX_TOOL_CALLS_PER_SESSION: "30"
      MAX_FOLLOWUP_QUESTIONS: "8"
      MAX_FOLLOWUP_TOTAL: "10"
      MAX_STATEMENT_CHARS: "4000"
      SESSION_IDLE_MINUTES: "30"
      CONFIDENCE_THRESHOLD: "4"
      DAILY_BUDGET_USD: "2.0"
      RATE_LIMIT_PER_MINUTE: "30"
      RATE_LIMIT_SESSIONS_PER_HOUR: "5"
      RATE_LIMIT_JUDGMENTS_PER_DAY: "10"

    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install trusted validator dependencies
        run: npm --prefix trusted ci --ignore-scripts

      - name: 비밀 없이 실제 Next Route 빌드
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --prefix trusted run build

      - name: Validate trusted main commit
        env:
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" || ! "${WORKFLOW_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::evidence must run from an immutable main commit"
            exit 1
          fi
          test "$(git -C trusted rev-parse HEAD)" = "${WORKFLOW_HEAD_SHA}"

      - name: Run blocker evidence harness
        env:
          BLOCKER_ID: ${{ inputs.blocker_id }}
          CODE_UNDER_TEST_SHA: ${{ github.sha }}
          EVIDENCE_REGION: github-hosted
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_REPOSITORY: ${{ github.workspace }}/trusted
          FINSHIELD_DATABASE_URL: ${{ secrets.FINSHIELD_DATABASE_URL }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: node trusted/.github/scripts/run-health-evidence.mjs --run

      - name: Validate raw evidence
        env:
          BLOCKER_ID: ${{ inputs.blocker_id }}
          CODE_UNDER_TEST_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_REPOSITORY: ${{ github.workspace }}/trusted
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: node trusted/.github/scripts/run-health-evidence.mjs --validate

      - name: Upload evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-evidence-${{ inputs.blocker_id }}-${{ github.sha }}
          path: evidence-output/result.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
