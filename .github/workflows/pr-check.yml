name: PR 체크

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 기존 PreCase Runtime 호환용 이름. 코드·테스트 이관 PR 전까지 유지한다.
      PRECASE_CI: "1"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      ANTHROPIC_API_KEY: sk-ci-placeholder-not-a-real-key
      ANTHROPIC_MODEL: claude-opus-5
      LAW_API_OC: ci-placeholder
      LAW_API_BASE: https://www.law.go.kr/DRF
      MAX_TOOL_CALLS_PER_CYCLE: "12"
      MAX_TOOL_CALLS_PER_SESSION: "30"
      MAX_FOLLOWUP_QUESTIONS: "8"
      MAX_FOLLOWUP_TOTAL: "10"
      MAX_STATEMENT_CHARS: "4000"
      SESSION_IDLE_MINUTES: "30"
      CONFIDENCE_THRESHOLD: "4"
      DAILY_BUDGET_USD: "2.0"
      RATE_LIMIT_PER_MINUTE: "30"
      RATE_LIMIT_SESSIONS_PER_HOUR: "5"
      RATE_LIMIT_JUDGMENTS_PER_DAY: "10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: DB 명세 검증
        run: node .github/scripts/validate-database-spec.mjs

      - run: npm ci

      - name: 라우트 타입 생성
        run: npx next typegen

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      # 현재 PreCase 기반 일부 정적 화면은 빌드 시 DB를 읽는다.
      # Vercel Preview가 실환경 build check를 담당하며 DB 의존 제거 후 CI build를 추가한다.
