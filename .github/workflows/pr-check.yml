# PR 체크 — 머지 조건을 사람 기억이 아니라 CI가 지키게 한다.
#
# HANDOFF 6장: "머지 전 npm test·npm run build 통과가 조건". 그동안 손으로
# 지켜 왔는데, 손으로 지키는 규칙은 바쁠 때 먼저 무너진다.
#
# ⚠️ **N-405가 요구하는 「환각 대조 테스트 CI 포함」의 구현체다.** 여기서 도는
# 검증 중 배포 게이트에 직접 걸리는 것:
#   · N-501 PII 마스킹 합성 117건 (미검출 0건)
#   · N-405 도구 반환값 ↔ 화면 인용 대조
#   · N-403 로그 정책 전수 점검
# 셋 다 자격증명이 필요 없어 CI에서 그대로 돈다.

name: PR 체크

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # ⚠️ 전부 **형식만 맞는 더미**다. 실자격증명을 CI에 두지 않는다.
      # env.ts가 기본값 없이 모듈 로드 시점에 검증하므로(설정 누락을 배포
      # 순간에 드러내려는 의도) 값이 있긴 해야 한다.
      PRECASE_CI: "1" # ← DB·외부 API 테스트는 이 값으로 skip된다 (src/test/live.ts)
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      ANTHROPIC_API_KEY: sk-ci-placeholder-not-a-real-key
      ANTHROPIC_MODEL: claude-opus-5
      LAW_API_OC: ci-placeholder
      LAW_API_BASE: https://www.law.go.kr/DRF
      MAX_TOOL_CALLS_PER_CYCLE: "12"
      MAX_TOOL_CALLS_PER_SESSION: "30"
      MAX_FOLLOWUP_QUESTIONS: "8"
      MAX_FOLLOWUP_TOTAL: "10"
      MAX_STATEMENT_CHARS: "4000"
      SESSION_IDLE_MINUTES: "30"
      CONFIDENCE_THRESHOLD: "4"
      DAILY_BUDGET_USD: "2.0"
      RATE_LIMIT_PER_MINUTE: "30"
      RATE_LIMIT_SESSIONS_PER_HOUR: "5"
      RATE_LIMIT_JUDGMENTS_PER_DAY: "10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ⚠️ 반드시 타입 검사보다 먼저다. `LayoutProps`·`PageProps`는 Next가
      # 생성하는 타입이라 `.next/types`가 없으면 tsc가 못 찾는다. 로컬은 이미
      # 빌드한 적이 있어 통과하고 CI만 깨지던 원인이 이것이었다(실측).
      - name: 라우트 타입 생성
        run: npx next typegen

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      # 배포 게이트 3종(N-501·N-405·N-403)이 여기 들어 있다
      - name: 테스트
        run: npm test

      # ⚠️ **빌드는 여기서 돌리지 않는다.** S-06(검증 결과)은 빌드 시점에
      # `validation_stats`를 읽어 정적 생성된다 — DB 장애에도 화면이 살아 있게
      # 하려는 의도이고(EX-402), 그래서 빌드에 DB가 필요하다. CI에는 자격증명이
      # 없으므로 빌드는 **Vercel이 실환경에서** 수행하고 PR에 상태를 단다.
      # 머지 조건의 "npm run build 통과"는 그 체크가 담당한다.
