name: PR 체크

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 기존 PreCase Runtime 호환용 이름. 코드·테스트 이관 PR 전까지 유지한다.
      PRECASE_CI: "1"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      ANTHROPIC_API_KEY: sk-ci-placeholder-not-a-real-key
      ANTHROPIC_MODEL: claude-opus-5
      PUBLIC_MCP_ENABLED: "false"
      LAW_API_OC: ci-placeholder
      LAW_API_BASE: https://www.law.go.kr/DRF
      MAX_TOOL_CALLS_PER_CYCLE: "12"
      MAX_TOOL_CALLS_PER_SESSION: "30"
      MAX_FOLLOWUP_QUESTIONS: "8"
      MAX_FOLLOWUP_TOTAL: "10"
      MAX_STATEMENT_CHARS: "4000"
      SESSION_IDLE_MINUTES: "30"
      CONFIDENCE_THRESHOLD: "4"
      DAILY_BUDGET_USD: "2.0"
      RATE_LIMIT_PER_MINUTE: "30"
      RATE_LIMIT_SESSIONS_PER_HOUR: "5"
      RATE_LIMIT_JUDGMENTS_PER_DAY: "10"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: DB 명세 검증
        run: node .github/scripts/validate-database-spec.mjs

      - name: Provider Stack ADR 검증
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_HEAD_SHA: ${{ github.sha }}
          VALIDATION_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/validate-provider-stack-adr.mjs

      - name: Provider ADR Validator Mutation Test
        run: node .github/scripts/test-provider-stack-adr-validator.mjs

      - name: CI Integrity Preflight Contract Test
        run: node .github/scripts/test-ci-integrity-preflight.mjs

      - name: Provider Model Spike Contract Test
        run: node .github/scripts/test-provider-model-spike.mjs

      - name: 라우트 타입 생성
        run: npx next typegen

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      # 현재 PreCase 기반 일부 정적 화면은 빌드 시 DB를 읽는다.
      # Vercel Preview가 실환경 build check를 담당하며 DB 의존 제거 후 CI build를 추가한다.
      - name: Vercel Preview 확인
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..60}; do
            state="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')"
            echo "Vercel status: ${state} (attempt ${attempt}/60)"

            case "${state}" in
              success)
                exit 0
                ;;
              failure|error)
                echo "::error::Vercel Preview failed with status ${state}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for Vercel Preview status"
          exit 1
